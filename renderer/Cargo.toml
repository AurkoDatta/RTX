[package]
name = "renderer"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
image = "0.25"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
thiserror = "1"
base64 = "0.22"

[dev-dependencies]
rand_chacha = "0.3"

[profile.release]
opt-level = 3
lto = true
